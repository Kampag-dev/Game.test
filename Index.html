<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Key Webpage</title>
</head>
<body>
    <h1>Welcome to the Panic Key Webpage</h1>
    <p>Press the "P" key to open IXL.com in a new tab!</p>

    <script>
        // This logs to the console, confirming the script is working (you can remove this in production)
        console.log("Panic Key Script Loaded!");

        // Event listener for detecting 'p' key press
        document.addEventListener('keydown', function(event) {
            if (event.key === 'p' || event.key === 'P') {
                // Open IXL.com in a new tab
                window.open('https://www.ixl.com', '_blank');
            }
        });
    </script>
</body>
</html>
